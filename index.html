<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f8f3">
<title>FLORA QR | Digital Botanical Garden</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green:#087b4b;
  --bright:#00ad68;
  --dark:#14251b;
  --muted:#65756a;
  --bg:#f5f8f3;
  --white:#fff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--bg);color:var(--dark);
 font-family:'DM Sans',sans-serif;line-height:1.65
}
h1,h2,h3,.brand{font-family:'Outfit',sans-serif;line-height:1.15}
a{text-decoration:none;color:inherit}
.wrap{width:min(1160px,calc(100% - 36px));margin:auto}
.announcement{
 background:#08b96d;color:#073b25;text-align:center;
 padding:9px;font-weight:700;font-size:13px
}
header{
 position:sticky;top:0;z-index:10;
 background:#f5f8f3ee;backdrop-filter:blur(15px);
 border-bottom:1px solid #e5ece5
}
.nav{height:75px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:29px;font-weight:800;letter-spacing:-2px}
.brand span{color:var(--bright)}
.navlinks{display:flex;gap:28px;font-weight:600}
.navlinks a:hover{color:var(--green)}
.menu{display:none;border:0;background:white;padding:10px;border-radius:10px}
.hero{padding:35px 0}
.hero-card{
 min-height:440px;border-radius:28px;padding:65px;
 display:flex;align-items:center;color:white;
 background:linear-gradient(90deg,#063d27e8,#063d2740),
 url('https://images.unsplash.com/photo-1448375240586-882707db888b?w=1800&q=85') center/cover
}
.eyebrow{color:#a8f0c5;font-weight:800;letter-spacing:3px;font-size:12px}
.hero h1{font-size:clamp(42px,7vw,78px);max-width:650px;margin:15px 0}
.hero p{max-width:530px;color:#e2f1e6;font-size:17px}
.btn{
 display:inline-block;background:var(--green);color:white;
 padding:13px 21px;border-radius:12px;font-weight:700;
 margin-top:12px;transition:.2s
}
.btn:hover{background:#065f3b;transform:translateY(-2px)}
.btn.white{background:white;color:#123b27}
.section{padding:45px 0}
.kicker{color:var(--green);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.section h2{font-size:42px;margin:8px 0}
.sub{color:var(--muted);max-width:620px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
.search{
 width:330px;padding:14px 16px;border:1px solid #e1e9e1;
 border-radius:13px;background:white;outline:none
}
.plant-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.plant-card{
 background:white;border:1px solid #e5ece5;
 border-radius:19px;overflow:hidden;transition:.25s
}
.plant-card:hover{transform:translateY(-5px);box-shadow:0 15px 35px #163c2015}
.plant-card img{width:100%;height:205px;object-fit:cover;display:block}
.plant-info{padding:17px}
.plant-info small{color:var(--green);font-weight:800;text-transform:uppercase}
.plant-info h3{font-size:21px;margin:8px 0 3px}
.plant-info p{color:var(--muted);font-style:italic;margin:0 0 12px}
.arrow{color:var(--green);font-weight:700}
.features{
 background:#103b27;color:white;padding:30px;border-radius:22px;
 display:grid;grid-template-columns:repeat(3,1fr);gap:25px
}
.features strong{font-family:'Outfit';font-size:18px}
.features p{color:#c7ddce;font-size:14px;margin-bottom:0}
.detail-hero{padding:35px 0 15px}
.breadcrumb{color:var(--muted);margin-bottom:18px;font-size:14px}
.banner{
 display:grid;grid-template-columns:1fr 1fr;gap:30px;
 background:white;border:1px solid #e5ece5;
 border-radius:25px;padding:18px;align-items:center
}
.banner>img{width:100%;height:390px;object-fit:cover;border-radius:17px}
.intro{padding:15px}
.intro h1{font-size:clamp(40px,5vw,65px);margin:12px 0}
.scientific{color:var(--green);font-style:italic;font-weight:700}
.intro p{color:var(--muted)}
.pills{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.pill{background:#e6f5e9;color:#17633d;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700}
.layout{display:grid;grid-template-columns:240px 1fr;gap:25px;padding:25px 0 55px}
.sidebar{
 background:white;border:1px solid #e5ece5;border-radius:17px;
 padding:18px;height:max-content;position:sticky;top:95px
}
.sidebar h3{margin-top:0}
.sidebar a{display:block;padding:9px;color:#53665a;font-size:14px;border-radius:8px}
.sidebar a:hover{background:#e6f5e9;color:var(--green)}
.info{
 background:white;border:1px solid #e5ece5;
 border-radius:18px;padding:24px;margin-bottom:15px;
 scroll-margin-top:100px
}
.info h2{font-size:25px;margin:0 0 14px}
.info ul{padding-left:22px;color:#4e6054}
.info li{padding:4px 0}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}
.photos img{width:100%;height:190px;object-fit:cover;border-radius:13px}
.note{
 background:#eff8f0;border-left:4px solid var(--bright);
 padding:15px;border-radius:0 12px 12px 0;color:#365743;margin:15px 0
}
.cta{
 background:#dff3e4;border-radius:22px;padding:30px;
 display:flex;justify-content:space-between;align-items:center;gap:20px
}
footer{background:#102d20;color:white;margin-top:50px;padding:40px 0 20px}
footer p{color:#b9cdbf;max-width:450px}
.copyright{border-top:1px solid #ffffff25;margin-top:25px;padding-top:18px;color:#a9c0b0;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}

@media(max-width:900px){
 .plant-grid{grid-template-columns:repeat(2,1fr)}
 .layout{grid-template-columns:200px 1fr}
 .hero-card{padding:35px}
}
@media(max-width:650px){
 .nav{height:65px}
 .menu{display:block}
 .navlinks{
  display:none;position:absolute;top:65px;left:0;right:0;
  background:var(--bg);padding:20px;flex-direction:column
 }
 .navlinks.open{display:flex}
 .hero{padding:20px 0}
 .hero-card{min-height:430px;padding:25px;background-position:center}
 .hero h1{font-size:48px}
 .heading{flex-direction:column;align-items:stretch}
 .search{width:100%}
 .plant-grid{gap:11px}
 .plant-card img{height:145px}
 .plant-info{padding:12px}
 .plant-info h3{font-size:17px}
 .features{grid-template-columns:1fr}
 .banner{grid-template-columns:1fr;padding:12px}
 .banner>img{height:260px}
 .intro{padding:10px}
 .layout{display:block}
 .sidebar{position:static;margin-bottom:15px}
 .sidebar nav{display:grid;grid-template-columns:1fr 1fr}
 .info{padding:18px}
 .photos img{height:130px}
 .cta{display:block}
}
</style>
</head>

<body>

<header>
<div class="wrap nav">

<a class="brand" href="./">FLORA<span>QR.</span></a>

</header>

<footer>
<div class="wrap">
<a class="brand" href="./">FLORA<span>QR.</span></a>
<p>A digital botanical garden created to make plant knowledge accessible through photographs, scientific information and QR-based discovery.</p>
<div class="copyright">© 2026 FLORA QR · Digital Botanical Garden</div>
</div>
</footer>

const app=document.getElementById("app");
const nav=document.getElementById("navlinks");
document.getElementById("menu").onclick=()=>nav.classList.toggle("open");

function safe(text){
 return String(text).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function list(items){
 return "<ul>"+items.map(x=>"<li>"+safe(x)+"</li>").join("")+"</ul>";
}
function card(key,p){
 return `<a class="plant-card" href="?plant=${key}">
 <img src="${p.image}" alt="${safe(p.name)}" loading="lazy">
 <div class="plant-info">
 <small>${p.category}</small>
 <h3>${p.short}</h3>
 <p>${p.scientific}</p>
 <span class="arrow">Explore plant →</span>
 </div></a>`;
}

function home(){
 app.innerHTML=`
 <section class="hero"><div class="wrap">
 <div class="hero-card"><div>
 <div class="eyebrow">DIGITAL BOTANICAL GARDEN</div>
 <h1>Discover the beauty of nature.</h1>
 <p>Explore plant life through beautiful photographs, botanical information and individual QR-linked profiles.</p>
 <a class="btn white" href="#plants">Explore Plants →</a>
 </div></div></div></section>

 <section class="section" id="plants"><div class="wrap">
 <div class="heading"><div>
 <div class="kicker">BROWSE COLLECTION</div>
 <h2>Explore Our Plants</h2>
 <p class="sub">Discover their habitats, features, flowers, fruits and ecological importance.</p>
 </div>
 <input class="search" id="search" placeholder="Search plants or scientific names...">
 </div>
 <div class="plant-grid" id="grid">
 ${Object.entries(plants).map(([k,p])=>card(k,p)).join("")}
 </div></div></section>

 <section class="section"><div class="wrap">
 <div class="features">
 <div><strong>Learn with clarity</strong><p>Easy-to-read botanical profiles and scientific information.</p></div>
 <div><strong>Explore plant diversity</strong><p>Discover ornamental plants, trees and food crops.</p></div>
 <div><strong>QR-ready profiles</strong><p>Open individual plant pages through QR links.</p></div>
 </div></div></section>

 <section class="section" id="about"><div class="wrap">
 <div class="cta"><div><div class="kicker">ABOUT FLORA QR</div>
 <h2>Nature has a story to tell.</h2>
 <p>A digital botanical garden connecting plant identification with accessible learning.</p>
 </div><a class="btn" href="#plants">Discover Plants →</a></div>
 </div></section>`;

 document.getElementById("search").addEventListener("input",e=>{
  let q=e.target.value.toLowerCase();
  let results=Object.entries(plants).filter(([k,p])=>
   [p.name,p.scientific,p.family,p.category].join(" ").toLowerCase().includes(q)
  );
  document.getElementById("grid").innerHTML=results.length?
   results.map(([k,p])=>card(k,p)).join(""):"<div class='empty'>No plants found.</div>";
 });
}

function section(id,title,items,images=""){
 return `<section class="info" id="${id}">
 <h2>${title}</h2>${list(items)}${images}</section>`;
}

function detail(key,p){
 let sections=[
 ["habitat","01. Habitat & Distribution",p.habitat],
 ["significance","02. Significance",p.significance],
 ["uses","03. Uses",p.uses],
 ["ecology","04. Ecological Importance",p.ecology],
 ["identification","05. Identification Features",p.identification],
 ["flowers","06. Flowers",p.flowers],
 ["fruits","07. Fruits",p.fruits]
 ];
 let links=sections.map(s=>`<a href="#${s[0]}">${s[1].replace(/^\d+\.\s/,"")}</a>`).join("");
 let content=sections.map(s=>{
  let photos="";
  if(s[0]==="identification")photos=`<div class="photos"><img src="${p.leaf}" alt="Leaves"><img src="${p.image}" alt="Whole plant"></div>`;
  if(s[0]==="flowers")photos=`<div class="photos"><img src="${p.flower}" alt="Flowers"><img src="${p.leaf}" alt="Foliage"></div>`;
  if(s[0]==="fruits")photos=`<div class="photos"><img src="${p.fruit}" alt="Fruits"><img src="${p.image}" alt="Plant"></div>`;
  return section(s[0],s[1],s[2],photos);
 }).join("");

 app.innerHTML=`
 <section class="detail-hero"><div class="wrap">
 <div class="breadcrumb"><a href="./">Home</a> / <a href="./#plants">Plants</a> / ${p.short}</div>
 <div class="banner">
 <img src="${p.image}" alt="${p.name}">
 <div class="intro">
 <div class="kicker">${p.category}</div>
 <h1>${p.name}</h1>
 <div class="scientific">${p.scientific}</div>
 <p>${p.summary}</p>
 <div class="pills"><span class="pill">${p.family}</span><span class="pill">${p.type}</span></div>
 <a class="btn" href="#habitat">Explore Botanical Profile ↓</a>
 </div></div></div></section>

 <div class="wrap layout">
 <aside class="sidebar"><h3>On this page</h3><nav>${links}</nav></aside>
 <div>${content}
 <div class="note"><b>Botanical note:</b> ${p.note}</div>
 <section class="info"><h2>Explore Other Plants</h2>
 <div class="plant-grid">${Object.entries(plants).filter(([k])=>k!==key).map(([k,x])=>card(k,x)).join("")}</div>
 </section></div></div>`;
}

const requested=new URLSearchParams(location.search).get("plant");
if(requested && plants[requested]){
 detail(requested,plants[requested]);
 document.title=plants[requested].name+" | FLORA QR";
}else{
 home();
